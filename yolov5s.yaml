# YOLOv5 by Ultralytics, AGPL-3.0 license
# Model configuration for YOLOv5s with custom Concat arguments.

# Model parameters
nc: 80  # Number of classes
depth_multiple: 0.33  # Depth scaling factor
width_multiple: 0.50  # Channel width scaling factor
anchors:
  - [10, 13, 16, 30, 33, 23]  # P3/8: small objects
  - [30, 61, 62, 45, 59, 119]  # P4/16: medium objects
  - [116, 90, 156, 198, 373, 326]  # P5/32: large objects

# Backbone
# Layer format: [from, repeats, module, args]
backbone:
  [[-1, 1, Conv, [64, 6, 2, 2]],  # 0: P1/2
   [-1, 1, Conv, [128, 3, 2]],  # 1: P2/4
   [-1, 3, C3, [128]],  # 2
   [-1, 1, Conv, [256, 3, 2]],  # 3: P3/8
   [-1, 6, C3, [256]],  # 4
   [-1, 1, Conv, [512, 3, 2]],  # 5: P4/16
   [-1, 9, C3, [512]],  # 6
   [-1, 1, Conv, [1024, 3, 2]],  # 7: P5/32
   [-1, 3, C3, [1024]],  # 8
   [-1, 1, SPPF, [1024, 5]]]  # 9

# Neck and detection head
head:
  [[-1, 1, Conv, [512, 1, 1]],  # 10
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],  # 11
   [[-1, 6], 1, Concat, [1, 512]],  # 12: fuse backbone P4 supports Q-GBFusion
   [-1, 3, C3, [512, False]],  # 13
   [-1, 1, Conv, [256, 1, 1]],  # 14
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],  # 15
   [[-1, 4], 1, Concat, [1, 256]],  # 16: fuse backbone P3 supports Q-GBFusion
   [-1, 3, C3, [256, False]],  # 17: P3/8 (small)
   [-1, 1, Conv, [256, 3, 2]],  # 18
   [[-1, 14], 1, Concat, [1, 256]],  # 19: fuse neck P4 supports Q-GBFusion
   [-1, 3, C3, [512, False]],  # 20: P4/16 (medium)
   [-1, 1, Conv, [512, 3, 2]],  # 21
   [[-1, 10], 1, Concat, [1, 512]],  # 22: fuse neck P5 supports Q-GBFusion
   [-1, 3, C3, [1024, False]],  # 23: P5/32 (large)
   [[17, 20, 23], 1, Detect, [nc, anchors]]]  # Detection outputs
